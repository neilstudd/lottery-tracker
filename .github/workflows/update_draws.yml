name: Update Lottery Draws

on:
  schedule:
    # Runs at 23:00 UTC every Wednesday and Saturday
    - cron: '0 23 * * 3,6'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-draws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fetch Script
        run: python scripts/update_draws.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of lottery draw history" && git push)