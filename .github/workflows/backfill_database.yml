name: Backfill Database

on:
  workflow_dispatch: # Trigger manually from Actions tab

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Backfill Script
        run: python scripts/backfill_draws.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/draws.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Backfill with the last 20 draws" && git push)